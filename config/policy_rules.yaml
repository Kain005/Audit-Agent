amount_thresholds:
  office_supplies: 50000
  travel: 150000
  software: 200000
  hardware: 300000
  vendor_payment_approval_above: 100000

duplicate_detection:
  same_vendor_same_amount_within_days: 30
  similar_amount_tolerance_percent: 2

timing_rules:
  business_hours_start: 9
  business_hours_end: 18
  flag_weekends: true
  flag_public_holidays: true
  indian_holidays:
    - name: Republic Day
      date: "2026-01-26"
    - name: Holi
      date: "2026-03-04"
    - name: Good Friday
      date: "2026-04-03"
    - name: Eid al-Fitr
      date: "2026-03-21"
    - name: Independence Day
      date: "2026-08-15"
    - name: Janmashtami
      date: "2026-09-05"
    - name: Gandhi Jayanti
      date: "2026-10-02"
    - name: Dussehra
      date: "2026-10-20"
    - name: Diwali
      date: "2026-11-08"
    - name: Christmas Day
      date: "2026-12-25"

split_billing:
  min_invoices_to_flag: 3
  within_days: 7
  all_below_threshold: 100000

round_number_bias:
  suspicious_round_amounts:
    - 50000
    - 100000
    - 200000
    - 500000
    - 1000000
  tolerance: 0

new_vendor:
  scrutiny_above_amount: 25000
  require_gst_verification: true

gst_rules:
  format_regex: "[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z]{1}[1-9A-Z]{1}Z[0-9A-Z]{1}"
  amount_tolerance_percent: 1
